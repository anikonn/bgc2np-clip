[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiba-clip"
version = "0.1.0"
description = "Shared CLIP core plus KIBA and MIBiG project layouts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Combi"}]
dependencies = [
  "torch>=2.1",
  "transformers>=4.39",
  "rdkit",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "umap-learn>=0.5",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyarrow>=14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
