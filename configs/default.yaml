seed: 42

featurization:
  protein_encoder: esm2
  protein_max_length: 1024
  esm2_model_name: facebook/esm2_t30_150M_UR50D
  one_hot_alphabet: ACDEFGHIKLMNPQRSTVWYX
  protein_batch_size: 8

model:
  name: dual_encoder_clip
  emb_dim: 256
  hidden_dim: 512
  dropout: 0.1
  init_temperature: 0.07
  max_logit_scale: 100.0

train:
  epochs: 20
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4

eval:
  sim_batch_size: 1024

downstream:
  feature_batch_size: 1024
  epochs: 30
  batch_size: 512
  lr: 0.001
  weight_decay: 0.0001
  hidden_dim: 256
  dropout: 0.1

output:
  dir: results/kiba_R_1_onehot
